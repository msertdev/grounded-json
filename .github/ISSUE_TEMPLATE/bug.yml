name: Bug report
description: Report reproducible incorrect behavior
title: 'bug: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: Thanks for providing a small, privacy-safe reproduction.
  - type: input
    id: version
    attributes:
      label: grounded-json version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      placeholder: Node.js 22.18.0 on Windows, macOS, or Linux
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use invented content and remove credentials or personal data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not contain a vulnerability or secret. I will use the private security flow if it does.
          required: true
